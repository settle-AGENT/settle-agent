name: fsai-production

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  networks:
    - app
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gateway:
    <<: *service-defaults
    image: caddy:2-alpine
    pull_policy: missing
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    environment:
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:-3000}
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT:-8080}
      AI_CONTAINER_PORT: ${AI_CONTAINER_PORT:-8000}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
      - ai

  frontend:
    <<: *service-defaults
    platform: linux/amd64
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/${ECR_FRONTEND_REPOSITORY:-fsai/frontend}:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    expose:
      - "${FRONTEND_CONTAINER_PORT:-3000}"

  backend:
    <<: *service-defaults
    platform: linux/amd64
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/${ECR_BACKEND_REPOSITORY:-fsai/backend}:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    env_file:
      - ./.env.secrets
    expose:
      - "${BACKEND_CONTAINER_PORT:-8080}"
    environment:
      SERVER_PORT: ${BACKEND_CONTAINER_PORT:-8080}
      AI_BASE_URL: http://ai:${AI_CONTAINER_PORT:-8000}
    depends_on:
      - ai

  ai:
    <<: *service-defaults
    platform: linux/amd64
    image: ${ECR_REGISTRY:?ECR_REGISTRY is required}/${ECR_AI_REPOSITORY:-fsai/ai}:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    expose:
      - "${AI_CONTAINER_PORT:-8000}"
    environment:
      OCR_CACHE_DIR: /tmp/ocr_cache

networks:
  app:
    driver: bridge
