# 단일 EC2 올인원 배포 — 레지스트리 없이 인스턴스에서 직접 빌드하고,
# Postgres(pgvector)를 같은 박스의 컨테이너로 띄운다.
#
# 특징
#   - 외부 RDS 대신 db 서비스 (rag.chunk · langgraph 체크포인트 · JPA 테이블 전부 여기)
#   - JPA_DDL_AUTO 를 .env 로 뺐다. 빈 DB 첫 기동은 update, 스키마가 생기면 validate.
#   - image 와 build 를 둘 다 둔다. 같은 파일로 두 경로가 다 돈다:
#       로컬 빌드   docker compose -f compose.selfhost.yml --env-file .env up -d --build
#       레지스트리  IMAGE_PREFIX/IMAGE_TAG 를 주고 pull → up -d   (CD 가 쓰는 경로)
#
# IMAGE_PREFIX 기본값은 settle 이라 로컬 빌드는 settle/ai:local 로 태그된다.

name: settle

x-defaults: &defaults
  restart: unless-stopped
  init: true
  networks: [app]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *defaults
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-settle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-settle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-settle} -d ${POSTGRES_DB:-settle}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    <<: *defaults
    image: ${IMAGE_PREFIX:-settle}/ai:${IMAGE_TAG:-local}
    build:
      context: ./ai
    env_file:
      - path: ./runtime.env
        format: raw
    environment:
      OCR_CACHE_DIR: /tmp/ocr_cache
    volumes:
      # 생성 서류(HTML·PDF). 컨테이너를 다시 만들어도 미리보기가 404 나지 않게 한다.
      - aioutput:/app/output
    expose:
      - "${AI_CONTAINER_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *defaults
    image: ${IMAGE_PREFIX:-settle}/backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
    env_file:
      - path: ./.env.secrets
        format: raw
    environment:
      SERVER_PORT: ${BACKEND_CONTAINER_PORT:-8080}
      AI_BASE_URL: http://ai:${AI_CONTAINER_PORT:-8000}
      # 빈 DB 로 처음 올릴 때만 update. 테이블이 생긴 뒤 .env 에서 validate 로 바꾼다.
      # validate 로 빈 DB 에 붙으면 Hibernate 가 기동을 거부한다 (Flyway 도입 전까지).
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    expose:
      - "${BACKEND_CONTAINER_PORT:-8080}"
    healthcheck:
      # temurin 이미지에 curl 이 없다. bash 의 /dev/tcp 로 포트만 확인한다.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/${BACKEND_CONTAINER_PORT:-8080}"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started

  frontend:
    <<: *defaults
    image: ${IMAGE_PREFIX:-settle}/frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCK: "false"
    expose:
      - "${FRONTEND_CONTAINER_PORT:-3000}"

  gateway:
    <<: *defaults
    image: caddy:2-alpine
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:-3000}
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT:-8080}
      AI_CONTAINER_PORT: ${AI_CONTAINER_PORT:-8000}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Let's Encrypt 인증서가 여기 산다. 이 볼륨을 잃으면 재발급이라
      # 반복하면 LE 발급 한도에 걸린다. 절대 지우지 말 것.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - ai

networks:
  app:
    driver: bridge

volumes:
  pgdata:
  aioutput:
  caddy_data:
  caddy_config:
