[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "boto3>=1.43.74",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.5.6",
    "langchain-openai>=1.5.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",   # checkpointer 재연결 — 전이 의존성에 기대지 않는다
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.0",
    # sentence-transformers 의 전이 의존성이지만, 아래 tool.uv.sources 로
    # CPU 휠을 지정하려면 직접 의존성이어야 한다.
    "torch>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
    "weasyprint>=69.0",
]

# 임베딩은 CPU 로 돈다. 기본 인덱스의 리눅스 torch 는 CUDA 런타임을 함께
# 끌고 와서(nvidia 2.9GB + triton 650MB) 이미지가 CI 러너 디스크를 넘긴다.
# macOS 휠은 원래 CPU 전용이므로 리눅스에서만 CPU 인덱스를 쓴다.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
