# 이 앱이 무엇을 근거로 답하고 있는지 — 외부 자료의 판(版) 목록.
#
# 지금까지 이 정보는 세 곳에 흩어져 있었다. 법령은 PDF 파일명, 매뉴얼은
# build_manual.py 의 문자열 상수, 서식은 템플릿 HTML 안의 문구. 어느 것도
# 기계가 읽지 않았고, 그래서 낡았는지 아무도 알 수 없었다.
#
# 두 날짜를 구분한다.
#   version        그 자료 자체의 판·시행일. 원본이 바뀌어야 바뀐다.
#   last_verified  "최신인지 우리가 마지막으로 확인한 날". 확인만 하고 판이
#                  그대로여도 갱신한다.
#
# 오래된 판이 곧 문제인 것은 아니다 — 개정이 없었으면 3년 전 서식이 여전히
# 최신이다. 문제는 **확인한 지 오래된 것**이다. 그래서 알림은 version 이
# 아니라 last_verified 를 기준으로 울린다.
#
# scripts/check_sources.py 가 이 파일을 읽어 검사한다.

version: "2026-09-05"          # 이 목록 자체를 마지막으로 손본 날

sources:
  # ── 법령 ────────────────────────────────────────────────
  # rules/corpus.json 은 아래 PDF 들로 만든다. filename 의 시행일이 version 과
  # 어긋나면 누군가 PDF 만 갈아끼우고 이 목록을 안 고친 것이다.
  - id: immigration_act
    name: 출입국관리법
    kind: statute
    version: "2026-01-23"
    decree_no: 제20992호
    last_verified: "2026-09-05"
    recheck_after_days: 180
    law_id: "001766"           # 국가법령정보센터 법령ID
    url: https://www.law.go.kr/법령/출입국관리법
    file: corpus/출입국관리법(법률)(제20992호)(20260123).pdf
    feeds: rules/corpus.json

  - id: immigration_decree
    name: 출입국관리법 시행령
    kind: statute
    version: "2025-06-01"
    decree_no: 제35540호
    last_verified: "2026-09-05"
    recheck_after_days: 180
    url: https://www.law.go.kr/법령/출입국관리법시행령
    file: corpus/출입국관리법 시행령(대통령령)(제35540호)(20250601).pdf
    feeds: rules/corpus.json

  - id: real_name_act
    name: 금융실명거래 및 비밀보장에 관한 법률
    kind: statute
    version: "2025-04-01"
    decree_no: 제20894호
    last_verified: "2026-09-05"
    recheck_after_days: 180
    url: https://www.law.go.kr/법령/금융실명거래및비밀보장에관한법률
    file: corpus/금융실명거래 및 비밀보장에 관한 법률(법률)(제20894호)(20250401).pdf
    feeds: rules/corpus.json

  - id: ftra
    name: 특정 금융거래정보의 보고 및 이용 등에 관한 법률
    kind: statute
    version: "2026-08-20"
    decree_no: 제21358호
    last_verified: "2026-09-05"
    recheck_after_days: 180
    url: https://www.law.go.kr/법령/특정금융거래정보의보고및이용등에관한법률
    file: corpus/특정 금융거래정보의 보고 및 이용 등에 관한 법률(법률)(제21358호)(20260820).pdf
    feeds: rules/corpus.json

  # 코퍼스에 넣지 않은 법령. 조문을 검색에 쓰지는 않지만, 통합신청서 서식이
  # 이 시행규칙의 별지이므로 여기가 개정되면 서식도 바뀐다. 서식 파일 자체는
  # 하이코리아에서 세션 없이 받을 수 없어 해시 비교가 안 된다 — 대신 서식을
  # 낳는 법령을 지켜본다.
  - id: immigration_rule
    name: 출입국관리법 시행규칙
    kind: statute
    version: "2026-01-23"
    decree_no: 법무부령 제1106호   # 2026. 1. 23. 일부개정
    last_verified: "2026-09-05"
    recheck_after_days: 180
    url: https://www.law.go.kr/법령/출입국관리법시행규칙
    governs: integrated_application_form
    note: >-
      코퍼스에는 넣지 않는다. 별지 제34호서식의 근거 법령으로만 지켜본다.
      개정됐다고 서식이 반드시 바뀌는 것은 아니다 — 이 시행규칙은 2026-01-23 에
      일부개정됐지만 별지 제34호서식은 2022-04-12 판 그대로다. 신호는 "서식이
      바뀌었다" 가 아니라 "서식을 확인해 볼 때다" 라는 뜻이다.
      입법예고안이 올라와 있으므로 다음 개정이 예정되어 있다.

  # ── 안내매뉴얼 ──────────────────────────────────────────
  # 원본 PDF 는 리포에 없다(15MB, gitignore). 결과물 rules/manual.json 만
  # 커밋되어 있다. 판이 바뀌면 build_manual.py 의 장 경계 탐지가 깨질 수
  # 있으므로, 갱신할 때는 그 출력의 경고를 반드시 눈으로 본다.
  - id: residence_manual
    name: 외국인체류 안내매뉴얼
    kind: manual
    version: "2026-08"
    publisher: 법무부 출입국·외국인정책본부
    last_verified: "2026-09-05"
    recheck_after_days: 300    # 대체로 연 1회 발간
    url: https://www.hikorea.go.kr
    feeds: rules/manual.json
    declared_in: scripts/build_manual.py   # LAW_FULL 상수

  # ── 서식 ────────────────────────────────────────────────
  # 시행규칙이 개정되면 칸이 바뀐다. 그때는 템플릿뿐 아니라 mappings 의 필드
  # 매핑과 visa_matrix 의 required_docs 도 함께 손봐야 한다.
  - id: integrated_application_form
    name: 출입국관리법 시행규칙 [별지 제34호서식] 통합신청서(신고서)
    kind: form
    version: "2022-04-12"      # 서식 자체의 개정일
    last_verified: "2026-09-05"
    recheck_after_days: 365
    url: https://www.hikorea.go.kr/board/BoardApplicationListR.pt?page=1
    feeds: templates/integrated_application.html
    declared_in: templates/integrated_application.html
    governed_by: immigration_rule   # 이 시행규칙이 개정되면 서식도 본다

  # ── 우리가 쓴 룰 ────────────────────────────────────────
  # 외부 자료가 아니라 위 자료들을 읽고 사람이 정리한 것이다. 원본이 바뀌면
  # 여기도 따라 바뀌어야 한다.
  - id: visa_matrix
    name: 체류자격 매트릭스
    kind: internal
    version: "2026-08-19"
    last_verified: "2026-09-05"
    recheck_after_days: 180
    feeds: rules/visa_matrix.yaml
    declared_in: rules/visa_matrix.yaml
