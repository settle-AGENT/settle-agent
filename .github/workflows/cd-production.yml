name: CD Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
  ECR_AI_REPOSITORY: ${{ vars.ECR_AI_REPOSITORY }}

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate Docker build files
        shell: bash
        run: |
          set -euo pipefail

          test -f frontend/Dockerfile
          test -f backend/Dockerfile
          test -f ai/Dockerfile
          test -f compose.production.yml
          test -f deploy/Caddyfile
          test -f deploy/prepare-runtime-env.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: github-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push frontend
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push AI
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./ai
          file: ./ai/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_AI_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      - name: Build and push backend
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy to EC2 with SSM
    needs:
      - build-and-push

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true

      - name: Create SSM deployment command
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "AWS_REGION=${AWS_REGION}"
            echo "ECR_REGISTRY=${ECR_REGISTRY}"
            echo "ECR_FRONTEND_REPOSITORY=${ECR_FRONTEND_REPOSITORY}"
            echo "ECR_BACKEND_REPOSITORY=${ECR_BACKEND_REPOSITORY}"
            echo "ECR_AI_REPOSITORY=${ECR_AI_REPOSITORY}"
            echo "IMAGE_TAG=${GITHUB_SHA}"
            echo "PUBLIC_HTTP_PORT=80"
            echo "FRONTEND_CONTAINER_PORT=3000"
            echo "BACKEND_CONTAINER_PORT=8080"
            echo "AI_CONTAINER_PORT=8000"
            echo "RDS_SECRET_ID=rds!db-9e062b45-1069-445e-9b94-894666f24268"
            echo "APP_SECRET_ID=fsai/hackathon/app-runtime"
            echo "RDS_ENDPOINT=fsai-hackathon-pg.cxcaw6gicm6c.ap-northeast-2.rds.amazonaws.com"
            echo "RDS_PORT=5432"
            echo "RDS_DATABASE=settlement"
            echo "AWS_S3_BUCKET=fsai-hackathon-assets-apne2-20260819"
          } > deploy.env

          COMPOSE_B64="$(base64 -w 0 compose.production.yml)"
          CADDY_B64="$(base64 -w 0 deploy/Caddyfile)"
          RUNTIME_ENV_B64="$(base64 -w 0 deploy/prepare-runtime-env.sh)"
          ENV_B64="$(base64 -w 0 deploy.env)"

          jq -n \
            --arg compose "$COMPOSE_B64" \
            --arg caddy "$CADDY_B64" \
            --arg runtime_env "$RUNTIME_ENV_B64" \
            --arg envfile "$ENV_B64" \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            '{
              commands: [
                "set -euo pipefail",
                "mkdir -p /opt/fsai/deploy",
                (
                  "printf %s " + ($compose | @sh) +
                  " | base64 -d > /opt/fsai/compose.production.yml"
                ),
                (
                  "printf %s " + ($caddy | @sh) +
                  " | base64 -d > /opt/fsai/deploy/Caddyfile"
                ),
                (
                  "printf %s " + ($runtime_env | @sh) +
                  " | base64 -d > /opt/fsai/deploy/prepare-runtime-env.sh"
                ),
                (
                  "printf %s " + ($envfile | @sh) +
                  " | base64 -d > /opt/fsai/.env"
                ),
                (
                  "aws ecr get-login-password --region " +
                  ($region | @sh) +
                  " | docker login --username AWS --password-stdin " +
                  ($registry | @sh)
                ),
                "cd /opt/fsai",
                "set -a && . /opt/fsai/.env && set +a",
                "chmod 700 /opt/fsai/deploy/prepare-runtime-env.sh",
                "/opt/fsai/deploy/prepare-runtime-env.sh",
                "docker compose --env-file .env -f compose.production.yml config --quiet",
                "docker compose --env-file .env -f compose.production.yml pull",
                "if docker container inspect fsai-caddy >/dev/null 2>&1; then docker rm -f fsai-caddy; fi",
                "docker compose --env-file .env -f compose.production.yml up -d --remove-orphans",
                "docker compose --env-file .env -f compose.production.yml ps",
                "curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1/health",
                "curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1/health/backend",
                "curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1/health/ai",
                "docker image prune -f --filter '\''until=168h'\''"
              ]
            }' > ssm-parameters.json

      - name: Send deployment command
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy GitHub commit ${GITHUB_SHA}" \
              --timeout-seconds 1200 \
              --parameters file://ssm-parameters.json \
              --query "Command.CommandId" \
              --output text
          )"

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${COMMAND_ID}"

      - name: Wait for deployment result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          STATUS="Pending"

          for attempt in $(seq 1 120); do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            echo "Waiting for SSM command: ${STATUS:-Pending}"
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{
              Status: Status,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }' \
            --output json

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
