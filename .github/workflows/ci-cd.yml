name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_BRANCH: ${{ github.base_ref }}
      HEAD_BRANCH: ${{ github.head_ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      CURRENT_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Validate branch flow
        shell: bash
        run: |
          if [[ "$BASE_BRANCH" == "master" ]]; then
            if [[ "$HEAD_BRANCH" != "develop" || "$HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ]]; then
              echo "::error::master에는 동일 저장소의 develop 브랜치만 PR을 보낼 수 있습니다."
              exit 1
            fi
          fi
          echo "Branch policy passed."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag settle-frontend:ci frontend

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test Spring backend
        working-directory: backend/server
        run: ./gradlew test --no-daemon
      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag settle-backend:ci backend

  ai:
    name: AI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Disk before build
        run: df -h /
      - name: Build AI image
        run: docker build --file ai/Dockerfile --tag settle-ai:ci ai
      - name: Smoke test AI image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name settle-ai-ci --publish 8000:8000 settle-ai:ci
          trap 'docker logs settle-ai-ci; docker rm --force settle-ai-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          exit 1

  compose-check:
    name: Compose validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate local compose
        run: docker compose config --quiet
