name: CI

on:
  pull_request:
    branches:
      - develop
      - master

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BASE_BRANCH: ${{ github.base_ref }}
      HEAD_BRANCH: ${{ github.head_ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      CURRENT_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Validate branch flow
        shell: bash
        run: |
          if [[ "$BASE_BRANCH" == "master" ]]; then
            if [[ "$HEAD_BRANCH" != "develop" || "$HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ]]; then
              echo "::error::master에는 동일 저장소의 develop 브랜치만 PR을 보낼 수 있습니다."
              exit 1
            fi
          fi

          echo "Branch policy passed."

  changes:
    name: Detect changes
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ai: ${{ steps.filter.outputs.ai }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed services
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(mktemp)"
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > "$changed_files"

          echo "Changed files:"
          cat "$changed_files"

          global_pattern='^(\.github/workflows/|docker-compose\.yml$|compose\.production\.yml$|deploy/)'

          if grep -Eq "^(frontend/)|${global_pattern}" "$changed_files"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq "^(backend/)|${global_pattern}" "$changed_files"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq "^(ai/)|${global_pattern}" "$changed_files"; then
            echo "ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "ai=false" >> "$GITHUB_OUTPUT"
          fi

  compose-check:
    name: Compose validate
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate local compose
        run: docker compose config --quiet

      - name: Validate production compose
        shell: bash
        env:
          ECR_REGISTRY: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com
          IMAGE_TAG: ci
          PUBLIC_DOMAIN: ci.example.invalid
        run: |
          set -euo pipefail

          # env_file 참조 때문에 파일이 존재해야 검증이 통과한다
          touch .env.secrets
          docker compose --file compose.production.yml config --quiet

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build frontend Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: settle-frontend:ci
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend,ignore-error=true

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/server/*.gradle*
            backend/server/gradle/wrapper/gradle-wrapper.properties

      - name: Test and package Spring backend once
        working-directory: backend/server
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew test bootJar --no-daemon

          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          test -n "$jar_file"
          cp "$jar_file" ../app.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build backend runtime image
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./backend
          file: ./backend/Dockerfile.runtime
          push: false
          tags: settle-backend:ci
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend,ignore-error=true

  ai:
    name: AI
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build AI Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: ./ai
          file: ./ai/Dockerfile
          push: false
          load: true
          tags: settle-ai:ci
          cache-from: type=gha,scope=ci-ai
          cache-to: type=gha,mode=max,scope=ci-ai,ignore-error=true

      - name: Smoke test AI Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach --name settle-ai-ci --publish 8000:8000 settle-ai:ci
          trap 'docker logs settle-ai-ci; docker rm --force settle-ai-ci' EXIT

          for attempt in $(seq 1 30); do
            echo "AI health check attempt ${attempt}/30"
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          exit 1

  ci-result:
    name: CI Result
    if: always()
    needs:
      - branch-policy
      - changes
      - compose-check
      - frontend
      - backend
      - ai
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail

          echo "Branch policy: ${{ needs.branch-policy.result }}"
          echo "Detect changes: ${{ needs.changes.result }}"
          echo "Compose validate: ${{ needs.compose-check.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "AI: ${{ needs.ai.result }}"

          [[ "${{ needs.branch-policy.result }}" == "success" ]]
          [[ "${{ needs.changes.result }}" == "success" ]]
          [[ "${{ needs.compose-check.result }}" == "success" ]]

          for result in \
            "${{ needs.frontend.result }}" \
            "${{ needs.backend.result }}" \
            "${{ needs.ai.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::A service validation job finished with status: $result"
              exit 1
            fi
          done

          echo "All required CI checks passed."
