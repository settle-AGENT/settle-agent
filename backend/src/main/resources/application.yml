spring:
  application:
    name: settle-agent-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settle}
    username: ${DB_USERNAME:settle}
    password: ${DB_PASSWORD:settle}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    create-schemas: true
    default-schema: app
    schemas: app

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}
