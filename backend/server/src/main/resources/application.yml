spring:
  application:
    name: settle-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settle}
    username: ${DB_USERNAME:settle}
    password: ${DB_PASSWORD:settle}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

settle:
  auth:
    passcode: ${AUTH_PASSCODE}
    jwt-secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3-bucket: ${AWS_S3_BUCKET:}
  ai:
    base-url: ${AI_BASE_URL:http://ai:8000}
